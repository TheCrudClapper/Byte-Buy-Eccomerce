<!DOCTYPE html>
<html lang="pl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avalonia To-Do — Desktop App Prototype</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'Segoe UI', 'sans-serif'],
                    },
                    colors: {
                        avalonia: {
                            accent: '#0078D4',
                            accentHover: '#1084E0',
                            accentDark: '#4CC2FF',
                            accentDarkHover: '#60CCFF',
                            bgDark: '#202020',
                            cardDark: '#2B2B2B',
                            cardDarkHover: '#323232',
                            borderDark: '#383838',
                            bgLight: '#F3F3F3',
                            cardLight: '#FFFFFF',
                            cardLightHover: '#F9F9F9',
                            borderLight: '#E5E5E5',
                        }
                    },
                    boxShadow: {
                        'desktop': '0 24px 60px -12px rgba(0, 0, 0, 0.45), 0 0 1px 1px rgba(255, 255, 255, 0.08)',
                        'desktop-light': '0 24px 60px -12px rgba(0, 0, 0, 0.16), 0 0 1px 1px rgba(0, 0, 0, 0.08)',
                    }
                }
            }
        }
    </script>

    <style>
        /* Niestandardowe paski przewijania w stylu Windows 11 / Avalonia Fluent */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(136, 136, 136, 0.35);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(136, 136, 136, 0.6);
        }

        /* Płynne przejścia między widokami */
        .view-enter {
            animation: slideFadeIn 0.18s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideFadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Stylizacja natywnego checkboxa Avalonia Fluent */
        .avalonia-checkbox {
            appearance: none;
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 5px;
            border: 1.5px solid #8A8A8A;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s ease;
            flex-shrink: 0;
        }
        .dark .avalonia-checkbox {
            background-color: #1F1F1F;
            border-color: #8E8E8E;
        }
        .avalonia-checkbox:hover {
            border-color: #0078D4;
        }
        .dark .avalonia-checkbox:hover {
            border-color: #4CC2FF;
        }
        .avalonia-checkbox:checked {
            background-color: #0078D4;
            border-color: #0078D4;
        }
        .dark .avalonia-checkbox:checked {
            background-color: #4CC2FF;
            border-color: #4CC2FF;
        }
        .avalonia-checkbox:checked::after {
            content: '';
            width: 5px;
            height: 10px;
            border: solid #FFFFFF;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg) translate(-0.5px, -0.5px);
        }
        .dark .avalonia-checkbox:checked::after {
            border-color: #141414;
        }
    </style>
</head>
<body class="min-h-screen w-full bg-gradient-to-br from-slate-300 via-zinc-200 to-slate-400 dark:from-[#0f1115] dark:via-[#161920] dark:to-[#0c0e12] flex items-center justify-center p-2 sm:p-6 font-sans antialiased selection:bg-[#0078D4] selection:text-white transition-colors duration-300">

    <!-- Symulowane okno aplikacji desktopowej Avalonia UI -->
    <main id="app-window" class="w-full max-w-[860px] h-[90vh] max-h-[680px] min-h-[480px] bg-avalonia-bgLight dark:bg-avalonia-bgDark text-zinc-900 dark:text-zinc-100 rounded-xl border border-black/15 dark:border-white/10 shadow-desktop-light dark:shadow-desktop flex flex-col overflow-hidden transition-all duration-200">
        
        <!-- Pasek tytułu (Custom Chrome w stylu Avalonia ExtendClientAreaToDecorationsHint) -->
        <header class="h-10 px-3.5 flex items-center justify-between bg-[#EAEAEA]/80 dark:bg-[#191919]/90 border-b border-black/5 dark:border-white/5 select-none shrink-0">
            <!-- Lewa strona: Ikona Avalonia + Tytuł aplikacji -->
            <div class="flex items-center gap-2.5">
                <!-- Logo SVG stylizowane na Avalonia UI -->
                <div class="w-5 h-5 rounded-md bg-gradient-to-tr from-[#0078D4] to-[#4CC2FF] flex items-center justify-center shadow-sm">
                    <svg class="w-3.5 h-3.5 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="9 11 12 14 22 4"></polyline>
                        <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
                    </svg>
                </div>
                <span class="text-xs font-semibold tracking-tight text-zinc-700 dark:text-zinc-200">Avalonia To-Do</span>
                <span class="hidden sm:inline-block text-[10px] px-1.5 py-0.5 rounded bg-black/5 dark:bg-white/10 text-zinc-500 dark:text-zinc-400 font-medium">Fluent v11.2</span>
            </div>

            <!-- Prawa strona: Przełącznik motywu Dark/Light + Kontrolki okna Windows -->
            <div class="flex items-center h-full -mr-3.5">
                <!-- Przełącznik motywu -->
                <button id="theme-toggle" type="button" title="Przełącz motyw (Jasny / Ciemny)" class="mr-2 px-2.5 py-1 rounded-md text-xs font-medium flex items-center gap-1.5 bg-white/70 dark:bg-white/5 hover:bg-white dark:hover:bg-white/10 border border-black/10 dark:border-white/10 text-zinc-700 dark:text-zinc-300 transition cursor-pointer">
                    <span id="theme-icon">🌙</span>
                    <span id="theme-label" class="hidden sm:inline">Ciemny</span>
                </button>

                <!-- Przyciski sterowania oknem (Minimalizuj, Maksymalizuj, Zamknij) -->
                <button type="button" onclick="showToast('Okno zminimalizowane (symulacja pulpitu)')" title="Minimalizuj" class="w-11 h-full flex items-center justify-center hover:bg-black/5 dark:hover:bg-white/10 text-zinc-600 dark:text-zinc-400 transition">
                    <svg class="w-3 h-3" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2">
                        <line x1="2" y1="6" x2="10" y2="6"></line>
                    </svg>
                </button>
                <button type="button" id="maximize-btn" onclick="toggleMaximize()" title="Maksymalizuj / Przywróć" class="w-11 h-full flex items-center justify-center hover:bg-black/5 dark:hover:bg-white/10 text-zinc-600 dark:text-zinc-400 transition">
                    <svg class="w-3 h-3" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2">
                        <rect x="2.5" y="2.5" width="7" height="7" rx="0.5"></rect>
                    </svg>
                </button>
                <button type="button" onclick="showToast('W prawdziwej aplikacji Avalonia wywołałoby to Close()')" title="Zamknij" class="w-11 h-full flex items-center justify-center hover:bg-[#C42B1C] hover:text-white text-zinc-600 dark:text-zinc-400 transition">
                    <svg class="w-3 h-3" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3">
                        <line x1="2.5" y1="2.5" x2="9.5" y2="9.5"></line>
                        <line x1="9.5" y1="2.5" x2="2.5" y2="9.5"></line>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Kontener główny aplikacji (dynamicznie renderuje Widok Startowy lub Widok Szczegółów Listy) -->
        <div id="view-container" class="flex-1 flex flex-col overflow-hidden relative">
            <!-- Zawartość wstrzykiwana przez JS -->
        </div>

        <!-- Pływające powiadomienie (Toast zamiast alert()) -->
        <div id="toast" class="pointer-events-none fixed bottom-6 left-1/2 -translate-x-1/2 z-50 opacity-0 translate-y-2 transition-all duration-200 bg-zinc-900 dark:bg-zinc-100 text-white dark:text-zinc-900 text-xs font-medium px-4 py-2 rounded-lg shadow-lg border border-white/10 dark:border-black/10">
            Komunikat
        </div>
    </main>

    <script>
        // ==========================================
        // STAN APLIKACJI (MVVM ViewModel Simulation)
        // ==========================================
        const state = {
            currentView: 'home', // 'home' | 'list'
            selectedListId: null,
            lists: [
                {
                    id: 'list-avalonia',
                    title: 'Projekt Avalonia',
                    icon: '💻',
                    color: '#0078D4',
                    tasks: [
                        { id: 't1', text: 'Skonfigurować FluentTheme w App.axaml', completed: true, priority: 'Wysoki' },
                        { id: 't2', text: 'Dodać nawigację między widokami (ViewLocator)', completed: true, priority: 'Normalny' },
                        { id: 't3', text: 'Zaprojektować pasek statusu z licznikiem na dole', completed: true, priority: 'Normalny' },
                        { id: 't4', text: 'Podpiąć zapis stanu listy do pliku JSON', completed: false, priority: 'Wysoki' },
                        { id: 't5', text: 'Przetestować responsywność na Windows i Linux', completed: false, priority: 'Niski' }
                    ]
                },
                {
                    id: 'list-praca',
                    title: 'Praca',
                    icon: '💼',
                    color: '#107C41',
                    tasks: [
                        { id: 't6', text: 'Code review pull requesta z modułem autoryzacji', completed: true, priority: 'Wysoki' },
                        { id: 't7', text: 'Spotkanie z zespołem UI/UX o 14:30', completed: false, priority: 'Normalny' },
                        { id: 't8', text: 'Zaktualizować dokumentację API w repozytorium', completed: false, priority: 'Niski' }
                    ]
                },
                {
                    id: 'list-zakupy',
                    title: 'Zakupy',
                    icon: '🛒',
                    color: '#D83B01',
                    tasks: [
                        { id: 't9', text: 'Kawa ziarnista 1kg', completed: true, priority: 'Wysoki' },
                        { id: 't10', text: 'Mleko owsiane, chleb żytni, masło', completed: true, priority: 'Normalny' },
                        { id: 't11', text: 'Owoce: banany, borówki, jabłka', completed: false, priority: 'Normalny' },
                        { id: 't12', text: 'Baterie AA do myszki bezprzewodowej', completed: false, priority: 'Niski' }
                    ]
                },
                {
                    id: 'list-dom',
                    title: 'Dom',
                    icon: '🏠',
                    color: '#8764B8',
                    tasks: [
                        { id: 't13', text: 'Podlać kwiaty w salonie', completed: true, priority: 'Normalny' },
                        { id: 't14', text: 'Opłacić rachunek za internet', completed: false, priority: 'Wysoki' }
                    ]
                }
            ]
        };

        // ==========================================
        // POMOCNICZE FUNKCJE UI
        // ==========================================
        let toastTimeout;
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.remove('opacity-0', 'translate-y-2');
            toast.classList.add('opacity-100', 'translate-y-0');

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-2');
            }, 2400);
        }

        function toggleMaximize() {
            const win = document.getElementById('app-window');
            win.classList.toggle('max-w-[860px]');
            win.classList.toggle('max-h-[680px]');
            win.classList.toggle('max-w-full');
            win.classList.toggle('max-h-full');
            win.classList.toggle('h-[96vh]');
        }

        // Przełączanie motywu Dark / Light
        const themeToggleBtn = document.getElementById('theme-toggle');
        themeToggleBtn.addEventListener('click', () => {
            const html = document.documentElement;
            const isDark = html.classList.toggle('dark');
            document.getElementById('theme-icon').textContent = isDark ? '🌙' : '☀️';
            document.getElementById('theme-label').textContent = isDark ? 'Ciemny' : 'Jasny';
        });

        // ==========================================
        // NAWIGACJA I LOGIKA DANYCH
        // ==========================================
        function openList(listId) {
            state.selectedListId = listId;
            state.currentView = 'list';
            render();
        }

        function goHome() {
            state.selectedListId = null;
            state.currentView = 'home';
            render();
        }

        function addNewList(event) {
            event.preventDefault();
            const input = document.getElementById('new-list-input');
            const title = input.value.trim();
            if (!title) return;

            const icons = ['📋', '🚀', '📌', '⚡', '🎯', '📁'];
            const colors = ['#0078D4', '#107C41', '#D83B01', '#8764B8', '#008272'];
            const randomIcon = icons[Math.floor(Math.random() * icons.length)];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];

            const newList = {
                id: 'list-' + Date.now(),
                title: title,
                icon: randomIcon,
                color: randomColor,
                tasks: []
            };

            state.lists.unshift(newList);
            input.value = '';
            render();
            showToast(`Utworzono listę "${title}"`);
        }

        function deleteList(event, listId) {
            event.stopPropagation();
            if (state.lists.length <= 1) {
                showToast('Musi pozostać co najmniej jedna lista zadań.');
                return;
            }
            state.lists = state.lists.filter(l => l.id !== listId);
            render();
            showToast('Usunięto listę zadań');
        }

        function addTask(event) {
            event.preventDefault();
            const input = document.getElementById('new-task-input');
            const prioritySelect = document.getElementById('new-task-priority');
            const text = input.value.trim();
            if (!text) return;

            const currentList = state.lists.find(l => l.id === state.selectedListId);
            if (!currentList) return;

            currentList.tasks.unshift({
                id: 'task-' + Date.now(),
                text: text,
                completed: false,
                priority: prioritySelect ? prioritySelect.value : 'Normalny'
            });

            input.value = '';
            render();
            // Przywróć fokus po przeładowaniu widoku
            setTimeout(() => {
                const refreshedInput = document.getElementById('new-task-input');
                if (refreshedInput) refreshedInput.focus();
            }, 10);
        }

        function toggleTask(taskId) {
            const currentList = state.lists.find(l => l.id === state.selectedListId);
            if (!currentList) return;

            const task = currentList.tasks.find(t => t.id === taskId);
            if (task) {
                task.completed = !task.completed;
                render();
            }
        }

        function deleteTask(taskId) {
            const currentList = state.lists.find(l => l.id === state.selectedListId);
            if (!currentList) return;

            currentList.tasks = currentList.tasks.filter(t => t.id !== taskId);
            render();
        }

        function clearCompletedTasks() {
            const currentList = state.lists.find(l => l.id === state.selectedListId);
            if (!currentList) return;

            const beforeCount = currentList.tasks.length;
            currentList.tasks = currentList.tasks.filter(t => !t.completed);
            const removedCount = beforeCount - currentList.tasks.length;

            if (removedCount > 0) {
                render();
                showToast(`Wyczyszczono ${removedCount} ukończonych zadań`);
            }
        }

        // ==========================================
        // RENDEROWANIE WIDOKÓW (AXAML View Templates)
        // ==========================================
        function render() {
            const container = document.getElementById('view-container');
            if (state.currentView === 'home') {
                container.innerHTML = renderHomeView();
            } else {
                container.innerHTML = renderListDetailView();
            }
        }

        // 1. WIDOK STARTOWY: "Listy To-Do"
        function renderHomeView() {
            const totalAllTasks = state.lists.reduce((acc, l) => acc + l.tasks.length, 0);
            const completedAllTasks = state.lists.reduce((acc, l) => acc + l.tasks.filter(t => t.completed).length, 0);

            const cardsHtml = state.lists.map(list => {
                const total = list.tasks.length;
                const done = list.tasks.filter(t => t.completed).length;
                const percent = total === 0 ? 0 : Math.round((done / total) * 100);
                const isAllDone = total > 0 && done === total;

                return `
                    <div onclick="openList('${list.id}')" 
                         class="group relative p-4 rounded-xl bg-avalonia-cardLight dark:bg-avalonia-cardDark hover:bg-avalonia-cardLightHover dark:hover:bg-avalonia-cardDarkHover border border-avalonia-borderLight dark:border-avalonia-borderDark hover:border-[#0078D4]/50 dark:hover:border-[#4CC2FF]/50 transition-all duration-150 cursor-pointer shadow-sm hover:shadow-md flex flex-col justify-between gap-3.5">
                        
                        <div class="flex items-start justify-between gap-2">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-lg flex items-center justify-center text-xl shadow-inner" style="background-color: ${list.color}20; color: ${list.color}">
                                    ${list.icon}
                                </div>
                                <div>
                                    <h3 class="font-semibold text-base text-zinc-800 dark:text-zinc-100 group-hover:text-[#0078D4] dark:group-hover:text-[#4CC2FF] transition-colors">
                                        ${escapeHtml(list.title)}
                                    </h3>
                                    <p class="text-xs text-zinc-500 dark:text-zinc-400">
                                        ${total === 0 ? 'Brak zadań' : `${done} z ${total} ukończonych`}
                                    </p>
                                </div>
                            </div>

                            <div class="flex items-center gap-1">
                                <button type="button" onclick="deleteList(event, '${list.id}')" title="Usuń listę" 
                                        class="opacity-0 group-hover:opacity-100 p-1.5 rounded-md text-zinc-400 hover:text-red-500 hover:bg-red-500/10 transition">
                                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                    </svg>
                                </button>
                                <span class="p-1 text-zinc-400 group-hover:translate-x-0.5 group-hover:text-[#0078D4] dark:group-hover:text-[#4CC2FF] transition-transform">
                                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <polyline points="9 18 15 12 9 6"></polyline>
                                    </svg>
                                </span>
                            </div>
                        </div>

                        <!-- Pasek postępu na kafelku -->
                        <div class="space-y-1.5">
                            <div class="flex justify-between text-[11px] font-medium">
                                <span class="${isAllDone ? 'text-emerald-600 dark:text-emerald-400' : 'text-zinc-500 dark:text-zinc-400'}">
                                    ${isAllDone ? '✓ Wszystko zrobione' : 'Postęp'}
                                </span>
                                <span class="text-zinc-600 dark:text-zinc-300">${percent}%</span>
                            </div>
                            <div class="w-full h-1.5 bg-black/10 dark:bg-white/10 rounded-full overflow-hidden">
                                <div class="h-full rounded-full transition-all duration-300" 
                                     style="width: ${percent}%; background-color: ${isAllDone ? '#10B981' : list.color}"></div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            return `
                <div class="view-enter flex-1 flex flex-col overflow-hidden">
                    <!-- Nagłówek widoku startowego -->
                    <div class="px-5 sm:px-7 pt-6 pb-4 flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-black/5 dark:border-white/5 shrink-0">
                        <div>
                            <h1 class="text-2xl font-bold tracking-tight text-zinc-900 dark:text-white">Listy To-Do</h1>
                            <p class="text-xs sm:text-sm text-zinc-500 dark:text-zinc-400 mt-0.5">
                                Wybierz kategorię, aby zarządzać zadaniami
                            </p>
                        </div>

                        <!-- Formularz szybkiego dodawania nowej listy -->
                        <form onsubmit="addNewList(event)" class="flex items-center gap-2 w-full sm:w-auto">
                            <input id="new-list-input" type="text" placeholder="Nowa lista..." maxlength="32"
                                   class="flex-1 sm:w-48 px-3 py-2 text-sm rounded-lg bg-white dark:bg-[#191919] border border-zinc-300 dark:border-[#3D3D3D] focus:outline-none focus:border-[#0078D4] dark:focus:border-[#4CC2FF] placeholder:text-zinc-400 transition" />
                            <button type="submit" 
                                    class="px-3.5 py-2 rounded-lg text-sm font-medium bg-[#0078D4] hover:bg-[#1084E0] dark:bg-[#4CC2FF] dark:hover:bg-[#60CCFF] text-white dark:text-zinc-950 shadow-sm transition cursor-pointer shrink-0 flex items-center gap-1.5">
                                <span class="text-base leading-none font-bold">+</span>
                                <span>Dodaj listę</span>
                            </button>
                        </form>
                    </div>

                    <!-- Siatka kafelków list -->
                    <div class="flex-1 overflow-y-auto p-5 sm:p-7">
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                            ${cardsHtml}
                        </div>
                    </div>

                    <!-- Stopka informacyjna widoku startowego -->
                    <footer class="h-11 px-5 sm:px-7 bg-[#EAEAEA]/70 dark:bg-[#191919]/80 border-t border-black/5 dark:border-white/5 flex items-center justify-between text-xs text-zinc-500 dark:text-zinc-400 shrink-0">
                        <span>Liczba list: <strong class="text-zinc-700 dark:text-zinc-200">${state.lists.length}</strong></span>
                        <span>Łącznie wykonano: <strong class="text-zinc-700 dark:text-zinc-200">${completedAllTasks} z ${totalAllTasks}</strong> zadań</span>
                    </footer>
                </div>
            `;
        }

        // 2. WIDOK SZCZEGÓŁÓW LISTY (Taski wyżej, podsumowanie zrobionych na dole)
        function renderListDetailView() {
            const list = state.lists.find(l => l.id === state.selectedListId);
            if (!list) {
                goHome();
                return '';
            }

            const total = list.tasks.length;
            const completedCount = list.tasks.filter(t => t.completed).length;
            const percent = total === 0 ? 0 : Math.round((completedCount / total) * 100);

            const priorityBadge = (priority) => {
                if (priority === 'Wysoki') {
                    return `<span class="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-red-500/15 text-red-600 dark:text-red-400 border border-red-500/20">Wysoki</span>`;
                }
                if (priority === 'Niski') {
                    return `<span class="text-[10px] font-medium px-2 py-0.5 rounded-full bg-zinc-500/15 text-zinc-600 dark:text-zinc-400">Niski</span>`;
                }
                return '';
            };

            const tasksHtml = total === 0
                ? `
                    <div class="h-full flex flex-col items-center justify-center text-center py-12 px-4">
                        <div class="w-14 h-14 rounded-2xl bg-black/5 dark:bg-white/5 flex items-center justify-center text-2xl mb-3">
                            ✨
                        </div>
                        <p class="text-sm font-semibold text-zinc-700 dark:text-zinc-200">Ta lista jest pusta</p>
                        <p class="text-xs text-zinc-500 dark:text-zinc-400 mt-1 max-w-xs">
                            Wpisz treść zadania w polu powyżej i kliknij przycisk "+", aby dodać pierwszy element.
                        </p>
                    </div>
                `
                : list.tasks.map(task => `
                    <div class="group flex items-center justify-between gap-3 px-3.5 py-2.5 rounded-lg bg-avalonia-cardLight dark:bg-avalonia-cardDark hover:bg-avalonia-cardLightHover dark:hover:bg-avalonia-cardDarkHover border border-avalonia-borderLight dark:border-avalonia-borderDark transition-all duration-150">
                        <label class="flex items-center gap-3 flex-1 min-w-0 cursor-pointer select-none">
                            <input type="checkbox" 
                                   class="avalonia-checkbox" 
                                   ${task.completed ? 'checked' : ''} 
                                   onchange="toggleTask('${task.id}')" />
                            <span class="text-sm truncate transition-all duration-150 ${task.completed ? 'line-through text-zinc-400 dark:text-zinc-500' : 'text-zinc-800 dark:text-zinc-100 font-medium'}">
                                ${escapeHtml(task.text)}
                            </span>
                        </label>

                        <div class="flex items-center gap-2 shrink-0">
                            ${!task.completed ? priorityBadge(task.priority) : ''}
                            <button type="button" onclick="deleteTask('${task.id}')" title="Usuń zadanie"
                                    class="opacity-70 sm:opacity-0 group-hover:opacity-100 p-1.5 rounded-md text-zinc-400 hover:text-red-500 hover:bg-red-500/10 transition cursor-pointer">
                                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <line x1="18" y1="6" x2="6" y2="18"></line>
                                    <line x1="6" y1="6" x2="18" y2="18"></line>
                                </svg>
                            </button>
                        </div>
                    </div>
                `).join('');

            return `
                <div class="view-enter flex-1 flex flex-col overflow-hidden">
                    <!-- Górny pasek widoku listy: Przycisk powrotu + Tytuł + Dodawanie taska -->
                    <div class="px-5 sm:px-7 pt-4 pb-4 bg-avalonia-bgLight dark:bg-avalonia-bgDark border-b border-black/5 dark:border-white/5 shrink-0 space-y-3.5">
                        <div class="flex items-center justify-between gap-2">
                            <button type="button" onclick="goHome()" 
                                    class="inline-flex items-center gap-1.5 px-2.5 py-1.5 -ml-2 rounded-lg text-xs sm:text-sm font-medium text-zinc-600 dark:text-zinc-300 hover:bg-black/5 dark:hover:bg-white/10 hover:text-[#0078D4] dark:hover:text-[#4CC2FF] transition cursor-pointer">
                                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                    <line x1="19" y1="12" x2="5" y2="12"></line>
                                    <polyline points="12 19 5 12 12 5"></polyline>
                                </svg>
                                <span>Wszystkie listy</span>
                            </button>

                            <span class="text-xs font-medium px-2.5 py-1 rounded-md bg-black/5 dark:bg-white/5 text-zinc-500 dark:text-zinc-400">
                                ${percent}% ukończono
                            </span>
                        </div>

                        <!-- Tytuł wybranej listy -->
                        <div class="flex items-center gap-3">
                            <div class="w-9 h-9 rounded-lg flex items-center justify-center text-lg shrink-0" style="background-color: ${list.color}22; color: ${list.color}">
                                ${list.icon}
                            </div>
                            <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-zinc-900 dark:text-white truncate">
                                ${escapeHtml(list.title)}
                            </h1>
                        </div>

                        <!-- Pole szybkiego dodawania nowego taska -->
                        <form onsubmit="addTask(event)" class="flex items-center gap-2 pt-0.5">
                            <input id="new-task-input" type="text" placeholder="Dodaj nowe zadanie do listy..." autocomplete="off"
                                   class="flex-1 px-3.5 py-2 text-sm rounded-lg bg-white dark:bg-[#191919] border border-zinc-300 dark:border-[#3D3D3D] focus:outline-none focus:border-[#0078D4] dark:focus:border-[#4CC2FF] placeholder:text-zinc-400 transition" />
                            
                            <select id="new-task-priority" title="Priorytet zadania"
                                    class="hidden sm:block px-2.5 py-2 text-xs font-medium rounded-lg bg-white dark:bg-[#191919] border border-zinc-300 dark:border-[#3D3D3D] text-zinc-700 dark:text-zinc-300 focus:outline-none focus:border-[#0078D4] dark:focus:border-[#4CC2FF] cursor-pointer">
                                <option value="Normalny">Normalny</option>
                                <option value="Wysoki">Wysoki</option>
                                <option value="Niski">Niski</option>
                            </select>

                            <button type="submit" title="Dodaj zadanie"
                                    class="w-10 h-9 sm:w-auto sm:px-4 rounded-lg text-sm font-semibold bg-[#0078D4] hover:bg-[#1084E0] dark:bg-[#4CC2FF] dark:hover:bg-[#60CCFF] text-white dark:text-zinc-950 shadow-sm transition cursor-pointer flex items-center justify-center gap-1 shrink-0">
                                <span class="text-lg leading-none font-bold">+</span>
                                <span class="hidden sm:inline">Dodaj</span>
                            </button>
                        </form>
                    </div>

                    <!-- GŁÓWNA CZĘŚĆ (WYŻEJ): Przewijana lista tasków -->
                    <div class="flex-1 overflow-y-auto px-5 sm:px-7 py-4 space-y-2">
                        ${tasksHtml}
                    </div>

                    <!-- DOLNY PASEK STATUSU (NA DOLE): Ilość zrobionych zadań + Pasek postępu + Czyszczenie -->
                    <footer class="px-5 sm:px-7 py-3 bg-[#EAEAEA]/90 dark:bg-[#181818] border-t border-black/10 dark:border-white/10 flex flex-col sm:flex-row sm:items-center justify-between gap-2.5 shrink-0">
                        <div class="flex items-center gap-3 flex-1">
                            <!-- Ikona statusu -->
                            <div class="w-7 h-7 rounded-md bg-[#0078D4]/15 dark:bg-[#4CC2FF]/15 text-[#0078D4] dark:text-[#4CC2FF] flex items-center justify-center shrink-0">
                                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="20 6 9 17 4 12"></polyline>
                                </svg>
                            </div>

                            <div class="flex-1 max-w-xs">
                                <div class="flex items-center justify-between text-xs mb-1">
                                    <span class="font-semibold text-zinc-800 dark:text-zinc-100">
                                        Ukończono: <span class="text-[#0078D4] dark:text-[#4CC2FF]">${completedCount}</span> z ${total} zadań
                                    </span>
                                    <span class="text-[11px] font-medium text-zinc-500 dark:text-zinc-400 ml-2">${percent}%</span>
                                </div>
                                <div class="w-full h-1.5 bg-black/10 dark:bg-white/10 rounded-full overflow-hidden">
                                    <div class="h-full rounded-full transition-all duration-300 bg-[#0078D4] dark:bg-[#4CC2FF]" style="width: ${percent}%"></div>
                                </div>
                            </div>
                        </div>

                        <!-- Przycisk usuwania ukończonych zadań -->
                        <button type="button" onclick="clearCompletedTasks()" 
                                ${completedCount === 0 ? 'disabled' : ''}
                                class="px-3 py-1.5 rounded-lg text-xs font-medium border transition self-end sm:self-auto
                                       ${completedCount > 0 
                                         ? 'bg-white dark:bg-[#2B2B2B] hover:bg-red-500/10 hover:text-red-600 dark:hover:text-red-400 hover:border-red-500/30 border-zinc-300 dark:border-[#3D3D3D] text-zinc-700 dark:text-zinc-200 cursor-pointer' 
                                         : 'bg-transparent border-transparent text-zinc-400 dark:text-zinc-600 cursor-not-allowed'}">
                            Wyczyść ukończone (${completedCount})
                        </button>
                    </footer>
                </div>
            `;
        }

        // Zabezpieczenie przed XSS przy wpisywaniu własnych nazw
        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // Inicjalizacja aplikacji po załadowaniu DOM
        window.addEventListener('DOMContentLoaded', () => {
            render();
        });
    </script>
</body>
</html>
