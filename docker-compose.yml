services:
# Backend
  byte-buy-backend:
    build:
      context: ./Byte&Buy.Backend
      dockerfile: src/ByteBuy.API/Dockerfile
    ports:
      - "${HTTPS_PORT_EXTERNAL}:${HTTPS_PORT_INTERNAL}"
      - "${HTTP_PORT_EXTERNAL}:${HTTP_PORT_INTERNAL}"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - COMPOSE=${COMPOSE}
      - ConnectionStrings__Default=Host=postgres;Port=${DB_PORT};Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}
      - Jwt__Audience=http://localhost:${FRONTEND_PORT_INTERNAL}
      - Jwt__ExpirationInMinutes=60
      - Jwt__Issuer=http://localhost:${HTTP_PORT_INTERNAL}
      - Jwt__SecretKey=some-failry-long-secret-key-i-want-to-use
      - Cors__AngularFrontend=http://localhost:${FRONTEND_PORT_INTERNAL}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:${HTTP_PORT_INTERNAL}/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - bb-internal-network

# Web-frontend
  byte-buy-frontend:
    build:
      context: ./Byte&Buy.AngularSPA
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT_EXTERNAL}:${FRONTEND_PORT_INTERNAL}"
    environment:
      - API_BASE_URL=${API_BASE_URL}
      - STATIC_IMAGES_BASE_URL=${STATIC_IMAGES_BASE_URL}
    depends_on:
      byte-buy-backend:
        condition: service_healthy
    networks:
      - bb-internal-network

# Database
  postgres:
    image: postgres:18
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    networks:
      - bb-internal-network
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./init/db.sql:/docker-entrypoint-initdb.d/01-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

# WebApp

# Networks
networks:
  bb-internal-network:
    driver: bridge

# Volumes
volumes:
  postgres_data:
